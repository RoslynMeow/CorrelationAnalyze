<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="纯前端 CSV 关联性分析看板：相关矩阵、目标关联、散点拟合、分组对比与自动结论。" />
    <title>关联性分析</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234c6ef5'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M14 46 26 32l10 7 14-19'/%3E%3C/g%3E%3Cg fill='%23fff'%3E%3Ccircle cx='14' cy='46' r='4'/%3E%3Ccircle cx='26' cy='32' r='4'/%3E%3Ccircle cx='36' cy='39' r='4'/%3E%3Ccircle cx='50' cy='20' r='4'/%3E%3C/g%3E%3C/svg%3E"
    />
    <script>
      // 在首帧前确定主题，避免“跟随系统”时闪白
      ;(function () {
        var mode = 'system'
        try {
          var raw = localStorage.getItem('ca-settings-v1')
          var s = raw ? JSON.parse(raw) : null
          if (s && s.appearance && s.appearance.mode) mode = s.appearance.mode
          else {
            var legacy = localStorage.getItem('ca-theme')
            if (legacy === 'dark' || legacy === 'light') mode = legacy
          }
        } catch (e) {
          /* 忽略：file:// 下可能禁用 localStorage */
        }
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
