name: Bug report
description: Report something that is not working as expected.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.
        Do **not** attach private or sensitive CSV data. A few anonymized rows are enough.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load a CSV with ...
        2. Open the "..." tab
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Data / CSV import
        - Matrix
        - Target
        - Scatter
        - Group
        - Pairs
        - Distribution
        - Category
        - Radar
        - Insights
        - Data preview
        - Settings / export
        - Other
  - type: input
    id: dataset
    attributes:
      label: Dataset shape
      placeholder: e.g. 30 rows × 20 columns, UTF-8, comma separated
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v2.0.0 or commit SHA
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Edge
        - Firefox
        - Safari
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Console logs / screenshots
      render: shell
